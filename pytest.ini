[pytest]
# Pytest configuration for shape-game

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, test interactions)
    slow: Slow running tests

# Coverage options (if using pytest-cov)
[coverage:run]
source = .
omit = 
    test_*.py
    build/*
    __pycache__/*
    .venv/*
    venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
